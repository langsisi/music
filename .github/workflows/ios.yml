name: Build iOS (unsigned IPA)

# iOS 只能在 macOS 上构建，Windows/Ubuntu runner 无法交叉编译。
# 本工作流产出一个「免签名」.ipa，用于 AltStore / Sideloadly 侧载，
# 不需要付费 Apple Developer 账号。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 应用版本号（留空则使用 Music.iOS.csproj 中的版本）
        required: false
        default: ''
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # GitHub 的 macOS 镜像用 DEVELOPER_DIR 指定默认 Xcode，其优先级高于
      # xcode-select；必须用它才能让构建真正用上 26.5（runner 无 27.0）。
      DEVELOPER_DIR: /Applications/Xcode_26.5.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .NET for iOS 的 workload 与 Xcode 版本强绑定（aka.ms/xcode-requirement）。
      # runner 最高只有 Xcode 26.6.x（尚无 27.0），因此锁定组合：
      #   .NET SDK 10.0.401 + workload set 10.0.401 → Microsoft.iOS 26.5.10318（要求 Xcode 26.5）
      # workload set 与 Xcode 的对应关系见 https://github.com/dotnet/macios/releases
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select Xcode 26.5
        run: |
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            ls -d /Applications/Xcode*.app
            echo "::error::未找到 Xcode_26.5.app，请按上面列表调整"
            exit 1
          fi
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Install iOS workload (pinned to Xcode 26.5 set)
        run: dotnet workload install ios --version 10.0.401

      - name: Restore
        run: dotnet restore src/Music.iOS/Music.iOS.csproj

      # 关键点：RNID=ios-arm64 出真机包；把 CodesignKey / CodesignProvision 置空
      # 并关闭「必须提供描述文件」，即得到可用于侧载的未签名包。
      # 命令行传的全局属性优先级高于 csproj 里的 <CodesignKey>iPhone Developer</CodesignKey>。
      # ValidateXcodeVersion=false：workload 的 Xcode 检查是「与推荐版本 major.minor 严格相等」，
      # 即使 DEVELOPER_DIR 已指向 Xcode_26.5.app 仍会误报（报错里要求 26.5、检测到 26.5，却判不等）。
      # 微软留了这个开关；Xcode 26.6 SDK 是 26.5 的超集，跳过检查后构建产物不受影响。
      - name: Build unsigned IPA
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION_ARG=""
          if [ -n "${APP_VERSION}" ]; then
            VERSION_ARG="-p:Version=${APP_VERSION} -p:ApplicationDisplayVersion=${APP_VERSION}"
          fi
          dotnet publish src/Music.iOS/Music.iOS.csproj \
            -c Release \
            -f net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:BuildIpa=true \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:CodesignRequireProvisioningProfile=false \
            -p:_RequireCodeSigning=false \
            -p:ValidateXcodeVersion=false \
            ${VERSION_ARG}

      - name: Inspect IPA
        run: |
          set -euo pipefail
          IPA=$(find src/Music.iOS/bin -name '*.ipa' -print -quit)
          if [ -z "$IPA" ]; then
            echo "::error::没有找到 .ipa，请检查上面的构建日志"
            exit 1
          fi
          echo "IPA: $IPA"
          shasum -a 256 "$IPA"
          unzip -l "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Music-iOS-unsigned-ipa
          path: src/Music.iOS/bin/**/*.ipa
          if-no-files-found: error
          retention-days: 30

  # 模拟器冒烟测试：在 runner 的 iOS 模拟器上直接跑应用，抓回 stdout
  # （NSLog / Avalonia 日志都会出现在这里）。真机黑屏若能在模拟器复现，
  # 异常堆栈一次看全；即使不复现，也证明启动链路在干净环境是通的，
  # 从侧面指认真机问题是 AOT/裁剪/ICU 相关。
  simulator-smoke:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Install iOS workload (pinned to Xcode 26.5 set)
        run: dotnet workload install ios --version 10.0.401

      # 模拟器包（iossimulator-arm64，Apple Silicon runner），无需任何签名。
      - name: Build simulator app
        run: |
          set -euo pipefail
          dotnet publish src/Music.iOS/Music.iOS.csproj \
            -c Release \
            -f net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:CodesignRequireProvisioningProfile=false \
            -p:_RequireCodeSigning=false \
            -p:ValidateXcodeVersion=false

      - name: Boot simulator, launch app, capture logs
        run: |
          set -euo pipefail
          # 挑一台可用的 iPhone 模拟器（iPad 在前也会被 grep 过滤掉）
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "模拟器 UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find src/Music.iOS/bin -name '*.app' -path '*iossimulator*' -print -quit)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"

          # --console 把应用 stdout/stderr 接进来，放后台跑；35 秒后截图（与真机观察窗口一致）
          xcrun simctl launch --console "$UDID" zhusl.music > launch.log 2>&1 &
          LAUNCH_PID=$!

          sleep 35
          xcrun simctl io "$UDID" screenshot smoke.png || true

          # 应用沙盒里的 startup.log（若已写出）取回展示
          CONTAINER=$(xcrun simctl get_app_container "$UDID" zhusl.music data || true)
          if [ -n "${CONTAINER}" ]; then
            find "$CONTAINER" -name 'startup.log' -exec cp {} startup-sim.log \; || true
            echo "--- startup.log（模拟器沙盒） ---"
            cat startup-sim.log 2>/dev/null || echo "(未写出)"
          fi

          kill "$LAUNCH_PID" 2>/dev/null || true
          echo "--- launch.log（应用 stdout，尾部 20000 字符） ---"
          tail -c 20000 launch.log || true

      - name: Upload smoke logs
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-logs
          path: |
            launch.log
            smoke.png
            startup-sim.log
          retention-days: 14